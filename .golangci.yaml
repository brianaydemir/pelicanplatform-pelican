# This file was updated from the old "v1" of golangci-lint config
# to the new "v2" format using `golangci-lint migrate`.

version: "2"

run:
  # Pelican is large enough that GitHub Actions sometimes time out
  # on a cold cache.
  timeout: 5m

  # The client-only and server-only commands live behind build tags,
  # so an untagged run silently skips all of the "cmd" package.
  # Linting both tags at once keeps whole-program linters, such as "unused",
  # from flagging helpers that only the other tag calls.
  build-tags:
    - client
    - server

linters:
  enable:
    - gocritic
    - misspell
  disable:
    - staticcheck
  settings:
    gocritic:
      # Only the ruleguard driver is wanted here. Without "disable-all",
      # enabling gocritic would also switch on its whole default check set
      # across the repository.
      disable-all: true
      enabled-checks:
        # "ruleguard" is tagged experimental, so it has to be named explicitly;
        # it is never enabled by a tag.
        - ruleguard
      settings:
        ruleguard:
          # "${config-path}" is the directory holding this file, so the
          # rules resolve the same from a subdirectory, from pre-commit,
          # and from golangci-lint-action.
          rules: "${config-path}/gorules/*.go"
          # Fail the run when a rules file cannot be loaded.
          failOn: "all"
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - reference$

issues:
  # Disable the caps on reported issues (0 means no cap).
  #
  # .github/scripts/check-ruleguard-rules.sh requires a diagnostic on
  # every marked line of a fixture, and every diagnostic from one
  # ruleguard rule carries the same message, so the default cap of 3 on
  # identical issues would hide most of them and fail the check.
  max-same-issues: 0
  max-issues-per-linter: 0

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/pelicanplatform/pelican
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - reference$
